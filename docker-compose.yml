version: "3.8"

services:

  mongodb-cmwb:
    image :  mongo:8.0.5
    container_name: mongodb-cmwb
    environment:
    - PUID=1000
    - PGID=1000
    volumes:
    - ./database:/data/db
    ports:
    - 27017:27017
    restart: unless-stopped

  cmwb:
    build: .
    image: cmwb
    command: npm run local
    ports:
      - 7000:7000

  wslsp:
    build: 
      context: .
      dockerfile: wslsp.Dockerfile
    image: wslsp-cmwb
    command: npm run server
    ports:
      - 7999:7999

  wordpress:
    image: wordpress:latest
    ports:
      - "3030:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: exampleuser
      WORDPRESS_DB_PASSWORD: examplepass
      WORDPRESS_DB_NAME: exampledb
    volumes:
      - ./docker/wordpress:/var/www/html

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: exampledb
      MYSQL_USER: exampleuser
      MYSQL_PASSWORD: examplepass
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/config/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - wordpress

volumes:
  db_data:
